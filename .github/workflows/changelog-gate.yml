name: PR changelog gate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog-gate:
    name: Changelog gate
    # Job-level concurrency is evaluated only after this condition. An unrelated
    # label event must not cancel an in-flight gate, much less the main CI.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'no-changelog'
    concurrency:
      group: pr-changelog-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Check this PR's Unreleased addition
        env:
          CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_GATE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bun script/check-pr-changelog.mjs
